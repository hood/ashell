[package]
name = "ashell"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, lazy, daemon-backed shell prompt"
license = "MIT"

[[bin]]
name = "ashell"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
gix = { version = "0.90", default-features = false, features = ["status", "revision", "parallel", "sha1", "max-performance"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
